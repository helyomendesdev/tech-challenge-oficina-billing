name: Billing CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: billing-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: billing_test
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing_test_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U billing -d billing_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://billing:billing_test_only@localhost:5432/billing_test
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run bandit -q -r billing_service
      - run: uv run pytest --cov=billing_service --cov-report=xml --cov-report=term-missing
      - name: Migrations and drift check
        env:
          DATABASE_URL: postgresql+psycopg://billing:billing_test_only@localhost:5432/billing_test
        run: |
          uv run python -c "from billing_service.database import Base,Database; import os; Base.metadata.drop_all(Database(os.environ['DATABASE_URL']).engine)"
          uv run alembic upgrade head
          uv run alembic check
      - name: Local participant demonstration
        run: uv run python scripts/demo.py
      - name: Dependency audit
        run: uv run pip-audit -r requirements.txt --disable-pip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: billing-coverage
          path: coverage.xml
          retention-days: 3
      - name: Check SonarQube Cloud configuration
        id: sonar-config
        if: >-
          github.ref == 'refs/heads/main' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -z "$SONAR_ORGANIZATION$SONAR_PROJECT_KEY$SONAR_TOKEN" ]]; then
            echo '::notice::SonarQube Cloud is waiting for repository configuration.'
            exit 0
          fi
          : "${SONAR_ORGANIZATION:?Configure SONAR_ORGANIZATION}"
          : "${SONAR_PROJECT_KEY:?Configure SONAR_PROJECT_KEY}"
          : "${SONAR_TOKEN:?Configure SONAR_TOKEN}"
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Scan Billing and wait for the Sonar quality gate
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=180
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t oficina-billing:${{ github.sha }} .
      - name: Container migrations and readiness
        run: |
          docker run --rm oficina-billing:${{ github.sha }} python -m billing_service.cli migrate
          docker run --rm oficina-billing:${{ github.sha }} python -c "from billing_service.contract import VALIDATORS; assert 'GerarOrcamento' in VALIDATORS"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - name: Billing containers, PostgreSQL and SQS integration
        run: |
          uv run python scripts/dev_keys.py
          export AUTH_JWT_PUBLIC_KEY_B64="$(cat .local/jwt-public.b64)"
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 180
          uv run python scripts/smoke_stack.py
      - name: Stop local stack
        if: always()
        run: docker compose down
