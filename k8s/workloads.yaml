# Render BILLING_IMAGE after running the migration Job.
# The namespace, ServiceAccount, ConfigMap and Secret are managed by the environment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  namespace: oficina-billing
spec:
  replicas: 1
  selector:
    matchLabels: {app: billing-api}
  template:
    metadata:
      labels: {app: billing-api}
    spec:
      serviceAccountName: billing-runtime
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: api
          image: BILLING_IMAGE
          ports: [{containerPort: 8000}]
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef: {name: billing-config, key: APP_ENV}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: billing-secrets, key: DATABASE_URL}
          envFrom:
            - configMapRef: {name: billing-config}
            - secretRef: {name: billing-secrets}
          readinessProbe:
            httpGet: {path: /health/ready/, port: 8000}
          livenessProbe:
            httpGet: {path: /health/live/, port: 8000}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: billing
  namespace: oficina-billing
spec:
  selector: {app: billing-api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-workers
  namespace: oficina-billing
spec:
  replicas: 1
  selector:
    matchLabels: {app: billing-workers}
  template:
    metadata:
      labels: {app: billing-workers}
    spec:
      serviceAccountName: billing-runtime
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: consumer
          image: BILLING_IMAGE
          args: [python, -m, billing_service.cli, consume]
          env: &runtime-env
            - name: APP_ENV
              valueFrom:
                configMapKeyRef: {name: billing-config, key: APP_ENV}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: billing-secrets, key: DATABASE_URL}
          envFrom: [{configMapRef: {name: billing-config}}, {secretRef: {name: billing-secrets}}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        - name: operations
          image: BILLING_IMAGE
          args: [python, -m, billing_service.cli, operations]
          env: *runtime-env
          envFrom: [{configMapRef: {name: billing-config}}, {secretRef: {name: billing-secrets}}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        - name: relay
          image: BILLING_IMAGE
          args: [python, -m, billing_service.cli, relay]
          env: *runtime-env
          envFrom: [{configMapRef: {name: billing-config}}, {secretRef: {name: billing-secrets}}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
