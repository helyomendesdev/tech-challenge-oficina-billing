apiVersion: batch/v1
kind: Job
metadata:
  name: BILLING_MIGRATION_JOB
  namespace: oficina-billing
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: billing-runtime
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: migrate
          image: BILLING_IMAGE
          command: [python, -m, billing_service.cli, migrate]
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef: {name: billing-config, key: APP_ENV}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: billing-secrets, key: DATABASE_URL}
          envFrom: [{configMapRef: {name: billing-config}}, {secretRef: {name: billing-secrets}}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
